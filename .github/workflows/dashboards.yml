name: Refresh brand dashboards

on:
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch: {}       # "Run workflow" button for an instant refresh

permissions:
  contents: write

concurrency:
  group: dashboards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==43.0.3
      - name: Rebuild dashboards from Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
          DASH_BRANDS: ${{ secrets.DASH_BRANDS }}
        run: python scripts/build_dashboards.py
      - name: Publish
        run: |
          git config user.name "advolo-bot"
          git config user.email "advolo-bot@users.noreply.github.com"
          git add d/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh dashboards"
          git push
